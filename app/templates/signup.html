<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up | Messenger</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="signup-container">
        <h2>Create an Account</h2>
        <p>Join the conversation today.</p>

        <!-- The action points to your Flask route, method MUST be POST -->
        <form action="/signup" method="POST">
            
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" placeholder="e.g. Nosferatu_Zodd" required>
            </div>


            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="••••••••" minlength="8" required>
            </div>

            <button type="submit" class="btn-signup">Sign Up</button>
        </form>

        <div class="footer-links">
            <span>Already have an account? <a href="/login">Log In</a></span>
        </div>
    </div>
</body>
</html>
