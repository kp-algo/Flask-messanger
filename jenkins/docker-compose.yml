services:
  jenkins:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: jenkins-server
    user: root
    ports:
      - "8080:8080"
      - "50000:50000"
    volumes:
      - jenkins_data:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - ci-network

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: cloudflare-tunnel
    command: tunnel --no-autoupdate run --token eyJhIjoiYTQ2ZjUwMjcxMGYwNzczN2M1YzM0OGVhODZiMGQzZWIiLCJ0IjoiYTViZTRmNTAtY2EwMy00YmVjLThkZGUtMzYyZjFmYzkyZTFkIiwicyI6IlkySmxPVEkxTm1RdFl6TXhOUzAwWkRSaUxXSmlaV1V0Tm1ZNU1XTm1NbUkwTXpBeU1ETTBPVFpsWTJNdFkyRTJZaTAwT0RBMkxUZzBOVGt0TW1SaE1qUmpOekUzTldFNCJ9
    restart: unless-stopped
    depends_on:
      - jenkins
    networks:
      - ci-network

volumes:
  jenkins_data:

networks:
  ci-network:
    driver: bridge